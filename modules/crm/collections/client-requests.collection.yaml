name: client-requests
record_title: '{{ name }}'
description: Something a client asked for.
ids:
  from: '{{ name | slug }}'
  pattern: ^[a-z0-9-]+$
fields:
  name:
    type: string
    required: true
  lead:
    type: leads
  status:
    type: string
    default: open
    enum: [open, in-progress, done]
  notes:
    type: markdown
    body: true
